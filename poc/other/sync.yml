name: 🔄 Sync & Alert

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  schedule:
    - cron: '*/5 * * * *'    # every 5 minutes
  workflow_dispatch:        # manual trigger

permissions:
  contents: write           # allow GITHUB_TOKEN to push

jobs:
  sync-and-alert:
    runs-on: ubuntu-latest
    steps:

      # 1) Check out your fork (full history + creds so we can push)
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2) Configure Git for merge commits
      - name: Configure Git user
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # 3) Add upstream remote & fetch its main branch
      - name: Add & fetch upstream
        run: |
          git remote add upstream https://github.com/projectdiscovery/nuclei-templates.git || true
          git fetch upstream main

      # 4) Detect any added or modified templates upstream
      - name: Detect upstream template changes
        id: detect
        run: |
          git diff --name-status origin/main..upstream/main \
            | awk '($1=="A"||$1=="M") && /\.ya?ml$/{print $1 ":" $2}' \
            > changes.txt || true
          echo "count=$(wc -l < changes.txt)" >> $GITHUB_OUTPUT

      # 5) Sync those templates (restore deleted or update modified)
      - name: Sync templates from upstream
        if: steps.detect.outputs.count != '0'
        run: |
          # extract only the paths (drop the A:/M: prefix)
          awk -F: '{print $2}' changes.txt > files.txt

          # restore/update from upstream
          git checkout upstream/main -- $(cat files.txt)

          # commit & push
          git add $(cat files.txt)
          git commit -m "chore: sync templates from upstream" || echo "No changes to commit"
          git push origin main

      # 6) Set up Python & install notifier deps
      - name: Set up Python & deps
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install packages
        run: pip install pyyaml requests

      # 7) Notify Discord for each change (A or M)
      - name: Notify Discord
        if: steps.detect.outputs.count != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          while read -r change; do
            status=${change%%:*}
            tpl=${change#*:}
            # skip if file not present
            [ -f "$tpl" ] || { echo "Skipping missing $tpl"; continue; }
            # notify: first arg = A or M, second = path
            python .github/scripts/notify.py "$status" "$tpl"
          done < changes.txt