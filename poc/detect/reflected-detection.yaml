id: reflected-detection

info:
  name: Reflected Input Detection
  author: reewardius
  severity: info
  description: Detects if user input is reflected in the response
  tags: fuzzing-req,reflected,dast
  
http:
  - pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'
        
    payloads:
      reflection:
        - "rwtest{{randstr_1}}"  # ← Уникальный маркер с рандомом
        
    fuzzing:
      - part: request
        type: postfix
        mode: single
        fuzz:
          - "{{reflection}}"
          
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      # Проверяем что наш маркер отражается
      - type: word
        part: body
        words:
          - "rwtest"
          
      # Проверяем что это не в комментариях или скриптах где безопасно
      - type: dsl
        dsl:
          - '!contains(body, "<!--rwtest")'  # Не в HTML комментарии
          - '!contains(body, "//rwtest")'     # Не в JS комментарии
        condition: and
        
    extractors:
      - type: regex
        part: body
        regex:
          - 'rwtest[a-z0-9]+'
        group: 0