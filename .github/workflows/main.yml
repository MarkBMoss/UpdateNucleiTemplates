name: Daily Update Nuclei Templates

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 14 * * *'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ✅ 核心修复：清理 Runner 预装的大型软件，释放 20GB+ 磁盘空间
      - name: Maximize Build Space (Free Disk Space)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests tqdm PyYAML

      - name: Run UpdateNucleiTemplates script
        run: python UpdateNucleiTemplates.py

      - name: 6 Delete Nuclei
        run: rm -rf nuclei

      - name: Commit and Push changes
        run: |
          git add .
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update POCs $(date +'%Y%m%d')"
          git push
